name: うらかたさんの売上を取り込む

on:
  schedule:
    - cron: '0 13 * * *'      # 毎日22:00 JST（営業終了後）
  workflow_dispatch:
    inputs:
      month:
        description: '取り込む月（例 2026-08）。空なら今月'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwrightを入れる
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 月を決める
        id: m
        run: |
          M="${{ github.event.inputs.month }}"
          if [ -z "$M" ]; then M=$(TZ=Asia/Tokyo date +%Y-%m); fi
          echo "month=$M" >> $GITHUB_OUTPUT
          echo "取り込む月: $M"

      - name: うらかたさんから取ってくる
        env:
          URAKATA_EMAIL: ${{ secrets.URAKATA_EMAIL }}
          URAKATA_PASSWORD: ${{ secrets.URAKATA_PASSWORD }}
        run: python3 fetch_urakata.py "${{ steps.m.outputs.month }}" out

      - name: スプレッドシートに入れる
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python3 import_sales.py "out/urakata_${{ steps.m.outputs.month }}.csv"

      # ⚠️ このリポジトリは公開（GitHub Pages を使うため）。
      # お客様の名前が入るCSV・スクリーンショットは絶対に成果物として残さない。
      - name: 失敗したとき、名前を伏せた手がかりだけ残す
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          for f in sorted(os.listdir('out')) if os.path.isdir('out') else []:
              print('出力ファイル:', f, os.path.getsize(os.path.join('out', f)), 'bytes')
          p = 'out/urakata_${{ steps.m.outputs.month }}.csv'
          if os.path.exists(p):
              lines = open(p, encoding='utf-8-sig').read().splitlines()
              print('CSV 行数:', len(lines) - 1)
              print('見出し:', lines[0] if lines else '(空)')
          PY

      - name: 失敗・要確認のときLINEで知らせる
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$LINE_TOKEN" ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"messages\":[{\"type\":\"text\",\"text\":\"🚨 うらかたさんの売上取り込み：取り込めなかったか、支払済みの金額が変わって要確認になりました\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
          fi
