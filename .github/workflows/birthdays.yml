name: 今月の誕生日リストを作る

on:
  schedule:
    # 毎月1日 9:00 JST に誕生日タブができていること（2026-10-13 彩さん）。
    # 1時・4時・7時 JST の3回起動し、もう作ってあれば後の回は何もしない。
    # cronは「月末日」を書けないので28〜31日のUTCで起動し、日本時間で1日のときだけ先へ進む
    - cron: '0 16 28-31 * *'   # 1日 1:00 JST（0時の売上取り込みと重ならないよう1時間ずらす）
    - cron: '0 19 28-31 * *'   # 1日 4:00 JST
    - cron: '0 22 28-31 * *'   # 1日 7:00 JST
  workflow_dispatch:
    inputs:
      month:
        description: '作る月（例 2026-11）。空なら今月'
        required: false
      dry:
        description: 'true なら読むだけで書き込まない（新しい画面の動作確認用）'
        required: false
        default: 'false'

concurrency:
  group: birthdays
  cancel-in-progress: false

jobs:
  birthdays:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 日本時間で1日か確かめる
        id: day
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then
            echo "go=no" >> $GITHUB_OUTPUT; echo "今日は1日ではないので何もしません"
          else
            echo "go=yes" >> $GITHUB_OUTPUT
          fi

      - name: 何時の回か（7時以降なら最後の回）
        id: hour
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -ge 7 ]; then echo "late=yes" >> $GITHUB_OUTPUT; else echo "late=no" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.day.outputs.go == 'yes'
      - uses: actions/setup-python@v5
        if: steps.day.outputs.go == 'yes'
        with:
          python-version: '3.11'

      - name: Playwrightを入れる
        if: steps.day.outputs.go == 'yes'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # ⚠️ このリポジトリは公開。ログには件数だけを出し、お客様の名前・誕生日は出さない
      - name: うらかたさんから作ってスプレッドシートに入れる
        if: steps.day.outputs.go == 'yes'
        env:
          URAKATA_EMAIL: ${{ secrets.URAKATA_EMAIL }}
          URAKATA_PASSWORD: ${{ secrets.URAKATA_PASSWORD }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          set -o pipefail
          M="${{ github.event.inputs.month }}"
          [ -z "$M" ] && M=$(TZ=Asia/Tokyo date +%Y-%m)
          SKIP=""
          [ "${{ github.event_name }}" = "schedule" ] && SKIP="--skip-if-done"
          [ "${{ github.event.inputs.dry }}" = "true" ] && SKIP="$SKIP --dry"
          python3 fetch_birthdays.py "$M" $SKIP 2>&1 | tee -a out.txt

      # 1時・4時の失敗は次の回がやり直すので知らせない。7時以降（9時に間に合わない恐れ）と手動実行だけ🚨
      - name: 7時の回でも作れなかったときLINEで知らせる
        if: failure() && github.event.inputs.dry != 'true' && (github.event_name != 'schedule' || steps.hour.outputs.late == 'yes')
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify_line.py "🚨 今月の誕生日リストが作れませんでした"
