<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベモーレ 売上日報</title>
<style>
:root{
  --bg:#faf7f4; --card:#fff; --line:#e6ded6; --ink:#3a3330; --sub:#8b7d74;
  --rose:#c08a90; --rose-d:#a76f76; --gold:#b99a66; --ok:#5b8c6e; --warn:#c2683f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.6;padding-bottom:40px}
header{background:var(--rose);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:.04em}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.75);
  padding:10px 14px;font-size:14px;font-weight:600;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--rose-d)}
main{padding:14px;max-width:820px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--rose-d);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--rose);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;
  padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--rose);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.sub{background:#fff;color:var(--rose-d);border:1px solid var(--rose)}
.btn.ghost{background:#f2ece7;color:var(--sub)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
/* 入力欄と横に並べるボタンは、入力欄と同じ高さにする（iPadでのズレ対策） */
.row>div>.btn.sm{height:40px;padding:0 16px}
.row>div.btnwrap{flex:0 0 auto}
/* iPadは日付の入力欄が横に広がるので、狭いときはボタンを次の行に出す（重なり防止） */
@media (max-width:900px){
  .row>div.btnwrap{flex:1 0 100%}
  .row>div.btnwrap>.btn.sm{width:100%}
}
/* スマホは横に2つ並べると入りきらないので、縦に積む */
@media (max-width:600px){
  .row>div{flex:1 0 100%}
}
/* 入力欄が中身の幅で広がって親からはみ出すのを防ぐ */
.row>div{min-width:0}
input,select{max-width:100%}
.btn.wide{width:100%;padding:14px}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fdfbf9}
.line .tag{display:inline-block;background:var(--rose);color:#fff;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:20px;margin-bottom:6px}
.line .tag.c{background:var(--gold)}.line .tag.p{background:var(--ok)}
.line .tag.s{background:#7e93b8}.line .tag.o{background:#9a8f88}
.del{background:none;border:0;color:var(--warn);font-size:13px;font-weight:600;cursor:pointer;padding:4px}
.tot{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.tot b{font-size:17px}
.mini{font-size:12px;color:var(--sub)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.chip{display:inline-block;background:#f2ece7;border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 3px 2px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.saleitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.saleitem .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.saleitem .nm{font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;
  transition:transform .25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.ok{color:var(--ok);font-weight:600}.ng{color:var(--warn);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>ベモーレ 売上日報</h1>
  <nav>
    <button data-t="pay" class="on">支払入力</button>
    <button data-t="stock">在庫払出</button>
    <button data-t="unpaid">未収</button>
    <button data-t="allow">日当</button>
    <button data-t="take">棚卸し</button>
    <button data-t="sum">集計</button>
    <button data-t="conf">設定</button>
  </nav>
</header>
<main>

<!-- ══ 支払入力 ══ -->
<section id="pay" class="on">
  <div class="card">
    <h2>うらかたさんから取り込んだ売上に、支払方法を入れる</h2>
    <div class="row">
      <div><label>月</label><select id="p_month"></select></div>
      <div><label>日（空なら月まとめて）</label><input type="date" id="p_date"></div>
      <div class="btnwrap"><button class="btn sm" id="btnPayLoad">表示</button></div>
    </div>
    <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink)">
      <input type="checkbox" id="p_all" style="width:auto"> 入力済みも表示する</label>
    <div class="mini" style="margin-top:6px" id="p_count"></div>
  </div>
  <div id="payList"></div>
</section>
<!-- ══ 在庫払出 ══ -->
<section id="stock">
  <div class="card">
    <h2>売上でない持ち出しを記録</h2>
    <div class="row">
      <div><label>日付</label><input type="date" id="k_date"></div>
      <div><label>用途</label><select id="k_use"></select></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>ブランドで絞る</label><select id="k_brand"></select></div>
      <div style="flex:0 0 80px"><label>数量</label><input type="number" id="k_qty" value="1" min="1"></div>
    </div>
    <div style="margin-top:8px"><label>商品</label>
      <input id="k_name" placeholder="商品名（打ち込むと候補がしぼられます）" autocomplete="off"></div>
    <div class="mini" id="k_hint" style="margin-top:4px"></div>
    <div id="k_sugg" style="margin-top:6px;max-height:220px;overflow-y:auto"></div>
    <button class="btn sub wide" id="btnAddLine" style="margin-top:8px">＋この商品を足す</button>
    <div id="k_list" style="margin-top:10px"></div>
    <div style="margin-top:8px"><label>メモ（まとめて付きます）</label><input id="k_memo" placeholder="任意"></div>
    <button class="btn wide" id="btnSaveStock" style="margin-top:10px">まとめて記録する</button>
  </div>
  <div class="card">
    <h2>今月の払出<button class="btn ghost sm" id="btnReloadStock">更新</button></h2>
    <div id="stockList"></div>
  </div>
</section>

<!-- ══ 未収 ══ -->
<section id="unpaid">
  <div class="card">
    <h2>後日いただく分<button class="btn ghost sm" id="btnReloadUnpaid">更新</button></h2>
    <div id="unpaidList"></div>
  </div>
</section>

<!-- ══ 日当 ══ -->
<section id="allow">
  <div class="card">
    <h2>日当5,000円がつかない日を入れる</h2>
    <div class="mini" style="margin-bottom:8px">研修や短時間勤務など、タイムカードにメモが入っていて日当が出ない日の金額をここに入れます</div>
    <div class="row">
      <div><label>日付</label><input type="date" id="a_date"></div>
      <div><label>スタッフ</label><select id="a_staff"></select></div>
    </div>
    <div style="margin-top:8px"><label>金額</label>
      <input type="text" inputmode="numeric" id="a_amount" placeholder="例：1200"></div>
    <div style="margin-top:8px"><label>メモ（理由をここに書く）</label><input id="a_memo" placeholder="例：プラペン研修2時間（600円×2）"></div>
    <button class="btn wide" id="btnSaveAllow" style="margin-top:10px">登録する</button>
  </div>
  <div class="card">
    <h2><span id="a_title">今月の分</span><button class="btn ghost sm" id="btnReloadAllow">更新</button></h2>
    <div class="row"><div><select id="a_month"></select></div></div>
    <div id="allowList" style="margin-top:10px"></div>
  </div>
</section>

<!-- ══ 集計 ══ -->
<section id="sum">
  <div class="card">
    <h2>月を選ぶ</h2>
    <div class="row">
      <div><select id="s_month"></select></div>
      <div class="btnwrap"><button class="btn sm" id="btnSum">集計する</button></div>
      <div class="btnwrap"><button class="btn sub sm" id="btnCsv">CSV保存</button></div>
    </div>
  </div>
  <div id="sumBody"></div>
</section>

<!-- ══ 棚卸し ══ -->
<section id="take">
  <div class="card">
    <h2>棚卸し
      <span>
        <button class="btn sm" id="btnTakeReload">更新</button>
        <button class="btn sub sm" id="btnTakeCsv">CSV保存</button>
      </span>
    </h2>
    <div class="mini">うらかたさんの在庫数 × 仕入値。仕入値はH.R.が5掛け、ほかは6掛け（実額が分かっているものはその値）</div>
    <div id="takeStamp" class="mini" style="margin-top:4px"></div>
  </div>
  <div id="takeBody"></div>
</section>

<!-- ══ 設定 ══ -->
<section id="conf">
  <div id="prodAlert"></div>
  <div class="card">
    <h2>商品マスタ<button class="btn sub sm" id="btnAddProd">＋追加</button></h2>
    <div id="prodList"></div>
  </div>
  <div class="card">
    <h2>メニューマスタ<button class="btn sub sm" id="btnAddMenu">＋追加</button></h2>
    <div id="menuList"></div>
  </div>
  <div class="card">
    <h2>スタッフ<button class="btn sub sm" id="btnAddStaff">＋追加</button></h2>
    <div id="staffList"></div>
  </div>
</section>

</main>
<div id="toast"></div>

<script>
// ★デプロイ後にGASウェブアプリのURLを貼る
const API_URL = 'https://script.google.com/macros/s/AKfycbw5r9qSAxC613fnqJOdlRsj1ORblpDGGf_IhuYPmJZwfk4kfOGqBxJ4D-OWBicezim7/exec';

let M = { products: [], menus: [], staff: [] };
let PAY_METHODS = ['現金','JMS','Square','振込','HPポイント','その他'];
let STOCK_USES = ['サロン使用','黒木購入'];
let editing = null;   // 編集中の会計ID
let createdAt = '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const yen = n => '¥' + (Number(n)||0).toLocaleString();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 押したあと無反応に見えないよう、終わるまで砂時計を回す（2026-09-19 彩さん）
async function busy(btn, label, fn){
  const was = btn.innerHTML, wasDis = btn.disabled;
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> ${label}`;
  try{ return await fn(); }
  finally{ btn.innerHTML = was; btn.disabled = wasDis; }
}

// 5秒たっても返ってこないとき、通信は切らずに「やり直す」を添える。
// Googleのサーバーは立ち上がりに30秒以上かかることがあるので、待つか押し直すかは彩さんが選ぶ
function slowNote(el, retry){
  const t = setTimeout(function(){
    el.innerHTML = '<div class="card mini">読み込み中…<br>'
      + '<span class="mini">時間がかかっています。しばらく使っていないと立ち上がりに30秒ほどかかることがあります。</span><br>'
      + '<button class="btn ghost sm" style="margin-top:8px">やり直す</button></div>';
    el.querySelector('button').onclick = retry;
  }, 5000);
  return function(){ clearTimeout(t); };
}
// 月のプルダウン。今月から前後にさかのぼって並べる
function fillMonths(sel, want){
  const now = new Date();
  const list = [];
  for(let i=-1; i<=15; i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    list.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  if(want && !list.includes(want)) list.unshift(want);
  sel.innerHTML = list.map(m=>{
    const [y,mm] = m.split('-');
    return `<option value="${m}">${y}年${Number(mm)}月</option>`;
  }).join('');
  if(want) sel.value = want;
}

function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms); }

function getPin(){ try{ return localStorage.getItem('bemolle_pin')||''; }catch(e){ return ''; } }
function setPin(v){ try{ localStorage.setItem('bemolle_pin', v); }catch(e){} }
async function askPin(msg){
  const v = prompt(msg || '管理者PINを入れてください（この端末に記憶します）');
  if(v) setPin(v);
  return v;
}
async function api(action, payload={}, params={}){
  const pin = getPin();
  if(pin){ params = Object.assign({}, params, {pin}); payload = Object.assign({}, payload, {pin}); }
  const q = new URLSearchParams(Object.assign({action}, params)).toString();
  const res = await fetch(API_URL + '?' + q, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload))
  });
  const j = await res.json();
  if(!j.ok){
    if(/ロック中/.test(j.error||'')) throw new Error(j.error);
    if(j.error==='unauthorized'){
      try{ localStorage.removeItem('bemolle_pin'); }catch(e){}
      const v = await askPin('PINが違います。もう一度入れてください');
      if(v) return api(action, payload, params);
    }
    throw new Error(j.error||'エラー');
  }
  return j.data;
}

// ─── タブ ───
$$('nav button').forEach(b => b.onclick = () => {
  $$('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  $$('section').forEach(s=>s.classList.remove('on')); $('#'+b.dataset.t).classList.add('on');
  if(b.dataset.t==='allow') loadAllowances();
  if(b.dataset.t==='stock') loadStocks();
  if(b.dataset.t==='unpaid') loadUnpaid();
  if(b.dataset.t==='take') loadStocktake();
  if(b.dataset.t==='conf') renderMasters();
});

// ─── 在庫払出 ───
// ブランドで候補を絞る。絞っても打ち込みは自由（登録していない商品も記録できる）
// iPadのSafariは予測候補（datalist）が出ないので、自前でタップできる一覧を出す
function fillProdList(){
  const b = $('#k_brand') ? $('#k_brand').value : '';
  const q = ($('#k_name').value || '').trim().toLowerCase();
  const base = (M.products||[]).filter(p => !b || p.brand === b);
  const list = q ? base.filter(p => (p.name+' '+(p.brand||'')).toLowerCase().includes(q)) : base;
  $('#k_sugg').innerHTML = list.slice(0,40).map(p=>
    `<div class="line" style="padding:8px 10px;margin-bottom:4px;cursor:pointer"
       onclick="pickProd('${esc(p.name).replace(/'/g,"\\'")}')">
       <span class="mini">${esc(p.brand||'')}</span> ${esc(p.name)}</div>`).join('')
    || '<div class="mini">候補にありません。そのまま打ち込めば記録できます</div>';
  $('#k_hint').textContent = `${b ? esc(b)+' の' : '登録済み'} ${list.length}件`
    + (list.length>40 ? '（上から40件を表示）' : '') + '（ここに無いものは打ち込みでOK）';
}
function pickProd(name){ $('#k_name').value = name; fillProdList(); $('#k_qty').focus(); }

// 同じ用途で何個も出すことがあるので、いったん溜めてからまとめて記録する
let KLINES = [];
function renderKLines(){
  const btn = $('#btnSaveStock');
  if(!KLINES.length){
    $('#k_list').innerHTML = '<div class="mini">まだ足していません。商品を選んで「＋この商品を足す」を押してください</div>';
    btn.textContent = 'この1件を記録する';
    return;
  }
  $('#k_list').innerHTML = '<table><tr><th>商品</th><th class="n">数</th><th></th></tr>'
    + KLINES.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="n">${l.qty}</td>
      <td><button class="del" onclick="delKLine(${i})">外す</button></td></tr>`).join('') + '</table>';
  btn.textContent = `まとめて記録する（${KLINES.length}件）`;
}
function delKLine(i){ KLINES.splice(i,1); renderKLines(); }
$('#btnAddLine').onclick = () => {
  const name = $('#k_name').value.trim();
  if(!name) return toast('商品を入れてください');
  KLINES.push({ name, qty: Number($('#k_qty').value)||1 });
  $('#k_name').value=''; $('#k_qty').value=1; $('#k_name').focus();
  renderKLines();
};
$('#btnSaveStock').onclick = async () => {
  const date=$('#k_date').value, use=$('#k_use').value, memo=$('#k_memo').value.trim();
  let lines = KLINES.slice();
  if(!lines.length){                                  // 足していなければ入力欄の1件だけ
    const name=$('#k_name').value.trim();
    if(!name) return toast('商品を入れてください');
    lines = [{ name, qty: Number($('#k_qty').value)||1 }];
  }
  const btn=$('#btnSaveStock');
  const was=btn.textContent;
  btn.disabled=true;
  btn.innerHTML = `<span class="spin"></span> 記録しています…（${lines.length}件）`;
  try{
    await api('saveStocks', { date, use, memo, lines });
    toast(lines.length+'件を記録しました');
    KLINES=[]; $('#k_name').value=''; $('#k_qty').value=1; $('#k_memo').value='';
  }catch(e){
    // 返事が返ってこないだけのことがあるので、入っていないか見に行く
    btn.innerHTML = `<span class="spin"></span> 記録できたか確認しています…`;
    let saved=false;
    try{
      const rows = await api('getStocks', {}, { date });
      saved = lines.every(l => rows.some(r => r.name===l.name && r.use===use));
    }catch(e2){}
    if(saved){ toast('記録できていました'); KLINES=[]; $('#k_name').value=''; $('#k_qty').value=1; $('#k_memo').value=''; }
    else { toast('記録できませんでした：'+e.message, 4000); }
  }finally{
    btn.disabled=false; btn.textContent=was;
    renderKLines(); loadStocks();
  }
};
$('#k_brand').onchange = () => { $('#k_name').value=''; fillProdList(); };
$('#k_name').oninput = fillProdList;
renderKLines();
$('#btnReloadStock').onclick = () => busy($('#btnReloadStock'), '…', loadStocks);
async function loadStocks(){
  const month = ($('#k_date').value || new Date().toISOString().slice(0,10)).slice(0,7);
  try{
    const rows = await api('getStocks', {}, { month });
    if(!rows.length){ $('#stockList').innerHTML = '<div class="mini">まだありません</div>'; return; }
    $('#stockList').innerHTML = `<table><tr><th>日付</th><th>商品</th><th class="n">数</th><th>用途</th><th>メモ</th><th></th></tr>`
      + rows.map(r => `<tr><td>${esc(r.date.slice(5))}</td><td>${esc(r.name)}</td><td class="n">${r.qty}</td>
        <td>${esc(r.use)}</td><td class="mini">${esc(r.memo||'')}</td>
        <td><button class="del" onclick="removeStock('${r.id}')">削除</button></td></tr>`).join('') + '</table>';
  }catch(e){ $('#stockList').innerHTML = `<div class="ng">${esc(e.message)}</div>`; }
}
async function removeStock(id){
  if(!confirm('この払出の記録を削除しますか？')) return;
  try{ await api('deleteStock', { id }); toast('削除しました'); loadStocks(); }
  catch(e){ toast(e.message); }
}

// ─── 未収 ───
$('#btnReloadUnpaid').onclick = () => busy($('#btnReloadUnpaid'), '…', loadUnpaid);
async function loadUnpaid(){
  $('#unpaidList').innerHTML = '<div class="card mini">読み込み中…</div>';
  const stopNote = slowNote($('#unpaidList'), loadUnpaid);
  try{
    const rows = await api('getUnpaid');

// 会計の中の担当をそのまま言う。1人ならその名前、混ざっていれば全部、空があれば「担当なし」も出す
function staffLine(s){
  const names = (s.items||[]).map(it => it.staff || '担当なし');
  const uniq = [...new Set(names)];
  if(!uniq.length) return '担当 —';
  if(uniq.length === 1) return '担当 ' + esc(uniq[0]);
  return '担当 ' + uniq.map(esc).join('・');
}
let PAYQ = [], PAYSEQ = 0;

        + '</div>').join('');

// 返事が返ってこなくても、書き込み自体は通っていることがある。
// 「保存できませんでした」と出す前に、本当に入っていないかを見に行く（2026-09-19 彩さん）
async function didItSave(id){
  for(let n=0; n<2; n++){
    try{
      const sale = await api('getSale', {}, { id });
      if(sale && sale.payments && sale.payments.length) return true;
      return false;
    }catch(e){ await new Promise(r=>setTimeout(r, 3000)); }   // 確認も失敗したら1回だけ待って再確認
  }
  return null;   // 確かめられなかった
}

async function quickPay(i, method){
  const s=PAYQ[i];
  if(s.payState==='入力済') return;
  // 先に画面を確定させて、保存は裏で走らせる（待たせない）
  s.payState='入力済';
  const card=$('#pc_'+i);
  card.style.opacity='.55';
  card.querySelectorAll('button').forEach(b=>b.remove());
  card.insertAdjacentHTML('beforeend',
    `<div style="margin-top:8px" id="ck_${i}"><span class="chip">${esc(method)} ${yen(s.gross)}</span> <span class="ok">✓</span></div>`);
  const rest=PAYQ.filter(x=>x.payState!=='入力済').length;
  $('#p_count').textContent=`${PAYQ.length}件 / 未入力 ${rest}件`;
  if(rest===0) toast('この月は全部入りました 🎉', 2500);
  try{
    await api('savePayments', { id:s.id, payments:[{method, amount:s.gross, status:'入金済'}] });
  }catch(e){
    const ck=$('#ck_'+i);
    if(ck) ck.innerHTML = '<span class="mini">保存できたか確認しています…</span>';
    const saved = await didItSave(s.id);
    if(saved === true){                       // 返事が来なかっただけで、入っていた
      if(ck) ck.innerHTML = `<span class="chip">${esc(method)} ${yen(s.gross)}</span> <span class="ok">✓</span>`;
      toast('保存できていました', 2500);
      return;
    }
    s.payState='未入力';
    card.style.opacity='1';
    const msg = (saved === false) ? '保存できませんでした' : '保存できたか確認できませんでした';
    if(ck) ck.innerHTML = `<span class="ng">${msg}：${esc(e.message)}</span>
      <button class="btn sm" onclick="loadPayQueue()">やり直す</button>`;
    const rest2=PAYQ.filter(x=>x.payState!=='入力済').length;
    $('#p_count').textContent=`${PAYQ.length}件 / 未入力 ${rest2}件`;
    toast(msg, 3000);
  }
}
function openSplit(i){

  box.dataset.open='1';

    <div id="spr_${i}"></div>

  p=p||{method:'現金',amount:'',status:'入金済'};

  w.innerHTML=`<div class="row">
    <div><select class="sm_m">${PAY_METHODS.map(m=>`<option ${p.method===m?'selected':''}>${m}</option>`).join('')}</select></div>

    <div style="flex:0 0 auto;padding-top:9px"><label style="display:flex;gap:5px;align-items:center;font-size:13px;color:var(--ink)">
      <input type="checkbox" class="sm_l" style="width:auto" ${p.status==='未収'?'checked':''}>後日</label></div>
    <div style="flex:0 0 auto;padding-top:6px"><button class="del">削除</button></div></div>`;
  w.querySelector('.del').onclick=()=>{w.remove();splitDiff(i);};
  w.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>splitDiff(i)));
  $('#spr_'+i).appendChild(w); splitDiff(i);
}
function splitDiff(i){
  const s=PAYQ[i];
  const sum=Array.from(document.querySelectorAll(`#spr_${i} .line`))
    .reduce((a,w)=>a+(Number(w.querySelector('.sm_a').value)||0),0);
  const d=s.gross-sum;
  $('#spd_'+i).innerHTML = d===0 ? '<span class="ok">✓ 合計と一致</span>'
    : `<span class="ng">差額 ${yen(d)}</span>`;
}
async function saveSplit(i){
  const s=PAYQ[i];
  const pays=Array.from(document.querySelectorAll(`#spr_${i} .line`)).map(w=>({
    method:w.querySelector('.sm_m').value, amount:Number(w.querySelector('.sm_a').value||0),
    status:w.querySelector('.sm_l').checked?'未収':'入金済'})).filter(p=>p.amount);
  try{ await api('savePayments',{id:s.id, payments:pays}); toast('保存しました'); loadPayQueue(); }
  catch(e){
    toast('保存できたか確認しています…', 4000);
    const saved = await didItSave(s.id);
    if(saved === true){ toast('保存できていました', 2500); loadPayQueue(); return; }
    toast((saved === false ? '保存できませんでした：' : '確認できませんでした：') + e.message, 4000);
  }
}

// ─── 日当 ───
$('#btnSaveAllow').onclick = () => busy($('#btnSaveAllow'), '登録しています…', async () => {
  const d = { date:$('#a_date').value, staff:$('#a_staff').value,
              amount:Number(String($('#a_amount').value).replace(/[^0-9-]/g,''))||0,
              memo:$('#a_memo').value.trim() };
  if(!d.amount) return toast('金額を入れてください');
  try{ await api('saveAllowance', d); toast('登録しました');
    $('#a_amount').value=''; $('#a_memo').value=''; loadAllowances();
  }catch(e){ toast(e.message); }
});
$('#btnReloadAllow').onclick = () => busy($('#btnReloadAllow'), '…', loadAllowances);
$('#a_month').onchange = loadAllowances;
$('#p_month').onchange = loadPayQueue;
async function loadAllowances(){
  const month = $('#a_month').value;
  try{
    const rows = await api('getAllowances', {}, month?{month}:{});
    if(!rows.length){ $('#allowList').innerHTML='<div class="mini">まだありません</div>'; return; }
    const sum = rows.reduce((a,r)=>a+r.amount,0);
    $('#allowList').innerHTML = `<table><tr><th>日付</th><th>スタッフ</th><th class="n">金額</th><th>メモ</th><th></th></tr>`
      + rows.map(r=>`<tr><td>${esc(r.date.slice(5))}</td><td>${esc(r.staff)}</td>
        <td class="n">${yen(r.amount)}</td><td>${esc(r.memo||'')}</td>
        <td><button class="del" onclick="removeAllowance('${r.id}')">削除</button></td></tr>`).join('')
      + `<tr><td colspan="2"><b>合計</b></td><td class="n"><b>${yen(sum)}</b></td><td colspan="2"></td></tr></table>`;
  }catch(e){ $('#allowList').innerHTML=`<div class="ng">${esc(e.message)}</div>`; }
}
async function removeAllowance(id){
  if(!confirm('削除しますか')) return;
  try{ await api('deleteAllowance',{id}); toast('削除しました'); loadAllowances(); }
  catch(e){ toast(e.message); }
}

// ─── 起動 ───
async function boot(silent){
  if(!getPin()) await askPin();
  try{
    const d = await api('getStartupData');
    M = d.masters; PAY_METHODS = d.payMethods; STOCK_USES = d.stockUses;
    const opt = n => `<option>${esc(n)}</option>`;
    $('#k_use').innerHTML = STOCK_USES.map(opt).join('');
    $('#a_staff').innerHTML = M.staff.map(s=>opt(s.name)).join('');
    const brands = [...new Set(M.products.map(p=>p.brand).filter(Boolean))].sort();
    $('#k_brand').innerHTML = '<option value="">すべて</option>' + brands.map(opt).join('');
    fillProdList();
    if(!silent){
      // URLに ?month=2026-08 が付いていればその月で開く（付いていなければ今月）
      const q = new URLSearchParams(location.search).get('month');
      const m = /^\d{4}-\d{2}$/.test(q || '') ? q : d.month;
      $('#k_date').value = d.today;
      fillMonths($('#p_month'), m); fillMonths($('#s_month'), m); fillMonths($('#a_month'), m);
      $('#a_date').value = d.today;
    }
  }catch(e){ if(!silent) toast('接続できません：' + e.message, 5000); }
}
// 起動の読み込み自体が遅いこともあるので、最初から「読み込み中…」を出しておく
$('#payList').innerHTML='<div class="card mini">読み込み中…</div>';
const stopBootNote = slowNote($('#payList'), ()=>location.reload());
boot().then(()=>{ stopBootNote(); if(getPin()) loadPayQueue(); })
      .catch(()=>{ stopBootNote(); });
setInterval(() => api('keepWarm').catch(()=>{}), 5*60*1000);
</script>
</body>
